server.port=8080
spring.application.name=logguard-ai

# MongoDB Atlas - MUST match .env key MONGO_URL
spring.data.mongodb.uri=${MONGO_URL}
spring.data.mongodb.database=logguard
spring.data.mongodb.auto-index-creation=true

# H2 for alerts - MUST be sa + empty password
spring.datasource.url=jdbc:h2:file:./data/logguard_alerts
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

alert.receiver.email=${ALERT_TO:}

# --- Security Hardening ---
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
spring.h2.console.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB